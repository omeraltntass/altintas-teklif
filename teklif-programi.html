<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:"><script src="masaustu.js"></script></head><body>
<title>Altıntaş Teklif</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="lib/html2pdf.bundle.min.js"></script>
<style>
/* Layout: koyu petrol kenar çubuğu + çalışma alanı; editörde ana sütun ve yapışkan fiyat paneli; belge her zaman beyaz A4 */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --sunken:#f9fafb; --ink:#1c232b; --muted:#5f6873; --line:#e2e5e9;
  --brand:#1c2733; --brand-ink:#eef1f4; --accent:#2e4a66; --accent-soft:#edf1f5; --gold:#b08326; --gold-soft:#f6efe0;
  --ok:#2c7a4b; --warn:#b06d12; --bad:#b23b31; --info:#2d5f8f;
  --f-ui:"Source Sans 3","Segoe UI",system-ui,sans-serif; --f-head:"Montserrat",system-ui,sans-serif; --f-logo:"Montserrat",system-ui,sans-serif; --w-head:600; --w-logo:700;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1a1f25; --sunken:#15191e; --ink:#e4e7eb; --muted:#9aa3ad; --line:#2b323a;
  --brand:#0d1014; --brand-ink:#e4e7eb; --accent:#9db7d1; --accent-soft:#1f2933; --gold:#d9ab47; --gold-soft:#2a241a;
  --ok:#69c290; --warn:#e3a24a; --bad:#ee7d72; --info:#83b3e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1f25; --sunken:#15191e; --ink:#e4e7eb; --muted:#9aa3ad; --line:#2b323a;
  --brand:#0d1014; --brand-ink:#e4e7eb; --accent:#9db7d1; --accent-soft:#1f2933; --gold:#d9ab47; --gold-soft:#2a241a;
  --ok:#69c290; --warn:#e3a24a; --bad:#ee7d72; --info:#83b3e6; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--brand);color:var(--brand-ink);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{margin:0 4px 22px}
.side nav{display:grid;gap:2px}
.side nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;opacity:.78;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.side nav button:hover{opacity:1;background:rgba(255,255,255,.06)}
.side nav button.on{opacity:1;background:rgba(255,255,255,.12)}
.side nav button:focus-visible{outline:2px solid var(--accent)}
.side nav .cnt{font-size:11px;opacity:.7}
.side .foot{margin-top:auto;font-size:11.5px;opacity:.6;padding:0 6px}
.main{min-width:0;padding-block:24px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}

.brandlogo{display:flex;align-items:center;gap:10px}
.brandlogo img{width:40px;height:40px;flex:none}
.brandlogo .w{display:grid;line-height:1}
.brandlogo .w b{font:var(--w-logo) 19px var(--f-logo);letter-spacing:.12em}
.brandlogo .w i{font:700 8.5px var(--f-ui);font-style:normal;letter-spacing:.42em;color:var(--gold);margin-top:5px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.top h1{margin:0;font:var(--w-head) 26px/1.2 var(--f-head);letter-spacing:.02em}
.top .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{cursor:pointer;border:none;background:none;color:var(--muted);width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;font-size:14px}
.icon:hover{background:var(--sunken);color:var(--ink)}
.icon.del:hover{color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:14px}
.card > h2{margin:0;font:700 15px var(--f-ui);display:flex;align-items:center;gap:10px}
.card > h2 small{font-weight:500;color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.num{text-align:right;font-variant-numeric:tabular-nums}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi b{font:700 22px var(--f-ui);font-variant-numeric:tabular-nums}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:860px}
table.list th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:none}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--sunken)}
.mono{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.r{text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st-Taslak{color:var(--muted)}.st-Gönderildi{color:var(--info)}.st-Revizyon{color:var(--warn)}.st-Onaylandı{color:var(--ok)}.st-Reddedildi{color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input{max-width:280px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent-soft)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:40px 24px;display:grid;gap:10px;justify-items:center;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:16px}
.empty img{width:56px;opacity:.9}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.ed-main{display:grid;gap:16px;min-width:0}
.aside{position:sticky;top:16px;display:grid;gap:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunken)}
.seg button{all:unset;cursor:pointer;text-align:center;padding:7px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.warnbox{font-size:12.5px;border-radius:8px;padding:8px 10px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent)}
.okbox{font-size:12.5px;color:var(--ok);font-weight:600}
.badbox{font-size:12.5px;color:var(--bad);font-weight:600}
.tl{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.tl span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.tl.big{font-size:17px;font-weight:800;border-top:1px solid var(--line);padding-top:10px}
.tl.big span:first-child{font-weight:700;font-size:13px;align-self:center}
.yazi{font-size:11.5px;color:var(--muted);font-style:italic}

.bolum{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.bh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--sunken);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bh .bn{font:var(--w-head) 20px var(--f-head);color:var(--accent);width:34px;text-align:center}
.bh input.bname{flex:1 1 200px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:transparent;border-color:transparent}
.bh input.bname:hover{border-color:var(--line)}
.bh .btot{font-weight:700;font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
.bh .bgot{width:150px}
.maddeler{display:grid}
.madde{display:grid;grid-template-columns:40px minmax(0,1fr) 300px auto;gap:8px 12px;padding:12px;border-bottom:1px solid var(--line);align-items:start}
.madde .mn{font-weight:800;color:var(--accent);padding-top:7px;font-variant-numeric:tabular-nums}
.madde .mtext{display:grid;gap:6px;min-width:0}
.madde .mtext input.mtitle{font-weight:700}
.madde .mprice{display:grid;grid-template-columns:70px 78px 1fr;gap:6px;align-content:start}
.madde .mprice .mtut{grid-column:1/-1;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.madde .mctl{display:grid;gap:2px}
.badd{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.addsec{display:grid;gap:10px}
.addsec .row{display:flex;gap:8px}
.addsec .row input{max-width:340px}
.cond{display:grid;gap:6px}
.cond label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.cond label input{margin-top:3px}
.cond label .t{flex:1}
.payrow{display:grid;grid-template-columns:90px 1fr 140px 28px;gap:8px;align-items:center}
.payrow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.savestate{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opts select{width:auto;max-width:100%;background:var(--accent-soft);border-color:var(--accent);font-weight:600;font-size:12.5px;padding:4px 8px}
.madde .mprice .cost{grid-column:1/-1}
.madde .mprice .cost input{background:var(--accent-soft)}
.madde .mprice .mkar{grid-column:1/-1;text-align:right;font-size:11.5px;color:var(--muted)}
.costcard{border-color:var(--accent)}
.kar-ok{color:var(--ok)}.kar-low{color:var(--warn)}.kar-bad{color:var(--bad)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.vers{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,20,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:86vh;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden;border:1px solid var(--line)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font:var(--w-head) 20px var(--f-head)}
.modal .ms{padding:12px 18px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.modal .ml{overflow:auto;padding:8px 10px}
.libitem{all:unset;cursor:pointer;display:grid;gap:3px;padding:10px 10px;border-radius:8px;width:100%;box-sizing:border-box}
.libitem:hover,.libitem:focus-visible{background:var(--sunken)}
.libitem b{font-size:13.5px}
.libitem span{font-size:12.5px;color:var(--muted)}
.libgroup{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 10px 4px}

/* library & settings */
.libtable .madde{grid-template-columns:150px minmax(0,1fr) 220px auto}
.clause{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.clause .cn{font:var(--w-head) 18px var(--f-head);color:var(--accent);padding-top:4px}
.clause .cb{display:grid;gap:6px}
code.ph{font-size:11.5px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 5px;cursor:pointer}

/* liste ve kontrol */
table.list th.sortable{cursor:pointer;user-select:none}
table.list th.sortable:hover{color:var(--ink)}
table.list .sarr{font-size:9px;margin-left:5px}
table.list tr.last td{background:var(--gold-soft)}
.lasttag{font-size:10.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}
.rowact .icon{font-size:16px}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
select.dsel{width:auto;font-size:12px;font-weight:700;padding:3px 6px;border-radius:999px;border-color:currentColor;background:var(--surface)}
.checkcard{border:1px solid var(--warn);background:var(--surface);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:grid;gap:6px;font-size:13px}
.checkcard b{color:var(--warn)}
.checkcard ul{margin:0;padding-left:18px;display:grid;gap:2px}
.checkcard .btn{justify-self:start}
.checkcard.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.ckrow{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.ckrow input{margin-top:3px}
.ckrow .hint{display:block}
.libitem{grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start}
.libitem .ck{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;margin-top:2px;display:grid;place-items:center;font-size:11px;line-height:1;color:var(--surface)}
.libitem.on{background:var(--accent-soft)}
.libitem.on .ck{background:var(--accent);border-color:var(--accent)}
.libitem.on .ck::after{content:"✓"}
.libitem .lt{display:grid;gap:3px;font-size:inherit;color:inherit;min-width:0}
.libitem .lt b{color:var(--ink)}
.libitem .lp{font-weight:600;font-size:12.5px;color:var(--muted)}
.libitem .ld{font-size:12.5px;color:var(--muted)}
.modal .mf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.modal .mf #libcount{flex:1;min-width:140px}
.modal .mf .hint{flex-basis:100%;order:3}
/* toast */
.toast[hidden]{display:none}
.toast .tact{all:unset;cursor:pointer;color:var(--gold);font-weight:700;padding:2px 4px;border-radius:4px}
.toast .tact:focus-visible{outline:2px solid var(--gold)}
.toast{display:flex;gap:14px;align-items:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* document (always paper) */
.paperwrap{overflow-x:auto;padding:8px 0 24px}
.doc{width:794px;margin:0 auto;background:#fff;color:#1c232b;font:12px/1.55 var(--f-ui);padding:56px 60px 48px;box-shadow:0 10px 40px rgba(20,28,38,.12);border-radius:2px}
.doc *{color:inherit}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.d-head .brandlogo img{width:58px;height:58px}
.d-head .brandlogo .w b{font-size:27px;color:#1c2733}
.d-head .brandlogo .w i{font-size:10px;color:#b08326}
.d-type{text-align:right}
.d-type .t{font:var(--w-head) 30px/1 var(--f-head);letter-spacing:.14em;color:#1c2733}
.d-type dl{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin:12px 0 0;font-size:11px;justify-content:end}
.d-type dt{color:#6b7480;text-align:right}
.d-type dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.d-rule{height:2px;background:linear-gradient(90deg,#b08326 0 64px,#1c2733 64px);margin:22px 0 22px}
.d-parties{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.d-parties small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.16em;color:#6b7480;margin-bottom:4px}
.d-parties b{display:block;font-size:14px;color:#1c2733}
.d-parties span{display:block;color:#4d5661}
.d-intro{margin:22px 0 8px;color:#343d47}
.d-sec{margin-top:22px}
.d-sec-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #dde1e5;padding-bottom:6px;margin-bottom:4px}
.d-sec-n{font:var(--w-head) 22px/1 var(--f-head);color:#6b7480;min-width:30px}
.d-sec-h h3{margin:0;font:800 12.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#1c2733;flex:1}
.d-madde{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px dotted #dde1e5}
.d-madde .n{font-weight:800;color:#6b7480;font-variant-numeric:tabular-nums}
.d-madde b{display:block;color:#1c2733;font-size:12.5px}
.d-madde p{margin:2px 0 0;color:#3a434d}
.d-madde .note{font-style:italic;color:#6b7480;font-size:11px}
.d-ma{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.d-ma span{display:block;color:#6b7480;font-size:10.5px}
.d-ma b{font-size:12.5px}
.d-sec-t{display:flex;justify-content:flex-end;gap:18px;padding:8px 0 0;font-weight:700;color:#1c2733;font-variant-numeric:tabular-nums}
.d-sec-t span{color:#6b7480;font-weight:600}
.d-sum{margin:28px 0 0 auto;width:330px;border:1px solid #1c2733;padding:14px 16px;display:grid;gap:5px}
.d-sum .l{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.d-sum .l span:first-child{color:#4d5661}
.d-sum .g{border-top:1px solid #1c2733;margin-top:6px;padding-top:8px;font-weight:800;font-size:15px;color:#1c2733}
.d-sum .g span:first-child{color:#1c2733;font-size:11px;letter-spacing:.08em;align-self:center}
.d-sum .yz{font-size:10.5px;color:#6b7480;font-style:italic;text-align:right}
.d-cond{margin-top:26px;display:grid;grid-template-columns:1fr;gap:28px}
.d-cond h4{margin:0 0 6px;font-size:9.5px;font-weight:800;letter-spacing:.16em;color:#6b7480}
.d-cond ol{margin:0;padding-left:16px;color:#3a434d;display:grid;gap:3px}
.d-cond table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.d-cond td{padding:4px 0;border-bottom:1px dotted #dde1e5;color:#3a434d}
.d-sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.d-sign div{border-top:1px solid #1c2733;padding-top:8px;font-size:11px;color:#4d5661;min-height:70px}
.d-sign b{display:block;color:#1c2733;font-size:12px}
.d-contact{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:10px;font-size:10px;color:#4d5661}
.d-contact span{white-space:nowrap}
.d-contact b{color:#6b7480;font-weight:800;font-size:8.5px;letter-spacing:.12em;margin-right:4px}
.d-slogan{font-size:10px;color:#6b7480;letter-spacing:.04em;margin-top:6px}

const num = v => { if (typeof v === "number") return isFinite(v) ? v : 0; let s = String(v ?? "").trim().replace(/\s|₺/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, ""); const n = parseFloat(s); return isNaN(n) ? 0 : n; };
const numIn = n => n ? String(n).replace(".", ",") : "";

function yaziyla(amount){
  const ones = ["","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"];
  const tens = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const groups = ["","bin","milyon","milyar","trilyon"];
  const three = n => { const h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10; return (h ? (h > 1 ? ones[h] : "") + "yüz" : "") + tens[t] + ones[o]; };
  amount = Math.round((amount || 0) * 100) / 100;
  let lira = Math.floor(amount), kurus = Math.round((amount - lira) * 100);
  if (lira === 0 && kurus === 0) return "sıfır Türk Lirası";
  let out = "", i = 0;
  while (lira > 0){ const g = lira % 1000; if (g){ const w = (i === 1 && g === 1) ? "" : three(g); out = w + groups[i] + out; } lira = Math.floor(lira / 1000); i++; }
  let s = (out || "sıfır") + " Türk Lirası";
  if (kurus) s += " " + three(kurus) + " Kuruş";
  return s;
}

/* ---------- varsayılanlar (Excel'den bağımsız) ---------- */
const BIRIMLER = ["gtr","adet","m²","mtül","m³","takım","kg","set"];
const DURUMLAR = ["Taslak","Gönderildi","Revizyon istendi","Onaylandı","Reddedildi"];
const BOLUM_ONERI = ["Yıkım ve hazırlık","Tesisat","Elektrik","Duvar ve tavan","Zemin","Mutfak","Banyo ve WC","Salon","Yatak odası","Mobilya ve dolap","Kapı ve pencere","Aydınlatma","Genel giderler"];
const DEFAULT_KOSULLAR = [
  "Fiyatlarımıza KDV dahil değildir.",
  "Teklifte yazılı olmayan malzeme, aksesuar ve işler kapsam dışıdır.",

];
const DEFAULT_ODEME = [{oran:40, aciklama:"Sözleşme imzasında"},{oran:40, aciklama:"Kaba işler tamamlandığında"},{oran:20, aciklama:"Teslimde"}];
const DEFAULT_MADDELER = [
  {baslik:"Sözleşmenin konusu", metin:"Bu sözleşmenin konusu, İşveren'e ait {IS_ADRESI} adresindeki mekânda, {TEKLIF_NO} numaralı onaylı teklifte ve bu sözleşmenin eki olan Ek-1 İş Kapsamı'nda tanımlanan tadilat ve dekorasyon işlerinin Yüklenici tarafından yapılmasıdır."},
  {baslik:"Kapsam ve ekler", metin:"İşin kapsamı Ek-1 ile sınırlıdır. Ek-1'de yer almayan iş, malzeme ve aksesuarlar sözleşme kapsamı dışındadır. Ek-1 İş Kapsamı ve Ek-2 Ödeme Takvimi bu sözleşmenin ayrılmaz parçasıdır; aralarında çelişki olması halinde sözleşme metni esas alınır."},
  {baslik:"Süre ve teslim", metin:"İşe başlama tarihi {BASLAMA}, planlanan teslim tarihi {TESLIM} olarak belirlenmiştir. Süre; mekânın boş ve çalışmaya hazır teslim edilmesi, seçimlerin zamanında onaylanması ve ödemelerin takvime uygun yapılması koşuluyla işler. İşveren kaynaklı gecikmeler ve mücbir sebepler süreye eklenir."},
  {baslik:"Sözleşme bedeli", metin:"Sözleşme bedeli {BEDEL} ({BEDEL_YAZI}) olup {KDV_DURUMU}."},
  {baslik:"Ödeme", metin:"Ödemeler Ek-2 Ödeme Takvimi'ne göre yapılır. Ödemenin gecikmesi halinde Yüklenici, gecikme süresince işi durdurma hakkına sahiptir; bu süre teslim tarihine eklenir."},
  {baslik:"Malzeme ve seçimler", metin:"Renk, desen, marka ve model seçimleri İşveren'in yazılı onayıyla kesinleşir. Doğal malzemelerde ve üretim partileri arasında görülen, standart tolerans içindeki ton ve desen farklılıkları ayıp sayılmaz."},
  {baslik:"Değişiklik ve ilave işler", metin:"Ek-1 dışındaki her talep ilave iştir. İlave işler, bedeli ve süreye etkisi yazılı olarak kararlaştırıldıktan sonra yapılır ve ek protokol ile sözleşmeye eklenir."},
  {baslik:"Teslim ve kabul", metin:"İşin tamamlanmasının ardından taraflar birlikte kontrol yapar. Tespit edilen eksikler bir tutanağa yazılır ve Yüklenici tarafından makul sürede giderilir."},
  {baslik:"Garanti", metin:"Yüklenici, kendi işçiliğinden kaynaklanan kusurlara karşı teslim tarihinden itibaren {GARANTI} garanti verir. Malzeme ve cihazlar üretici veya ithalatçı garantisine tabidir. Kullanım hatası ve dış etkenlerden doğan hasarlar garanti dışıdır."},
  {baslik:"Fesih", metin:"Taraflardan biri yükümlülüklerini yerine getirmezse diğer taraf yazılı bildirimde bulunur. Aykırılık bildirimden itibaren 10 gün içinde giderilmezse sözleşme feshedilebilir. Fesih halinde yapılmış işler ve temin edilmiş malzemeler hesaplanarak taraflar arasında mahsuplaşılır."},
  {baslik:"Mücbir sebep", metin:"Doğal afet, salgın, resmi kararlar ve tarafların kontrolü dışındaki benzeri olaylar mücbir sebep sayılır. Bu süre boyunca taraflar yükümlülüklerinden sorumlu tutulmaz ve iş süresi uzar."},
  {baslik:"Uyuşmazlıklar", metin:"Uyuşmazlıklarda öncelikle uzlaşma yolu denenir. Çözülemeyen uyuşmazlıklarda {MAHKEME} Mahkemeleri ve İcra Daireleri yetkilidir. İşveren'in tüketici olduğu hallerde tüketici mevzuatının zorunlu hükümleri saklıdır."},
  {baslik:"Yürürlük", metin:"İki nüsha olarak düzenlenen bu sözleşme, taraflarca imzalandığı tarihte yürürlüğe girer."}
];
const PLACEHOLDERS = ["{IS_ADRESI}","{TEKLIF_NO}","{BASLAMA}","{TESLIM}","{BEDEL}","{BEDEL_YAZI}","{KDV_DURUMU}","{GARANTI}","{MAHKEME}","{MUSTERI}","{FIRMA}"];
const DEFAULT_AYAR = {
  firma:{ad:"Altıntaş Dekorasyon", unvan:"", slogan:"İç mimari · Tadilat · Dekorasyon", yetkili:"", showroomAdres:"", showroomTel:"", fabrikaAdres:"", fabrikaTel:"", gsm:"", eposta:"", web:"", instagram:"", vergiDairesi:"", vergiNo:"", banka:"", iban:"", mahkeme:"", garanti:"2 (iki) yıl"},
  teklif:{gecerlilik:15, kdv:20, buyukHarf:false, giris:"Talebiniz doğrultusunda hazırladığımız teklifimizi bilgilerinize sunar, iyi çalışmalar dileriz.", kosullar:DEFAULT_KOSULLAR.join("\n")},
  sozlesmeMaddeleri: DEFAULT_MADDELER
};

/* ---------- veri katmanı ---------- */
const store = {
  db:null, mode:"local",
  async init(){
    try { if (window.claude && window.claude.use) this.db = await window.claude.use("db"); } catch(e){ this.db = null; }
    this.mode = this.db ? "db" : "local";
  },
  lsGet(col){ try { return JSON.parse(localStorage.getItem("altintas_" + col) || "[]"); } catch(e){ return []; } },
  lsSet(col, arr){ try { localStorage.setItem("altintas_" + col, JSON.stringify(arr)); } catch(e){} },
  async list(col){
    if (this.db){ const snap = await this.db.collection(col).get(); return snap.docs.map(d => Object.assign(clone(d.data() || {}), {id:d.id})); }
    return this.lsGet(col);
  },
  async put(col, obj){
    const body = clone(obj); const id = body.id; delete body.id;
    if (this.db){ await this.db.collection(col).doc(id).set(body); return; }
    const arr = this.lsGet(col); const i = arr.findIndex(x => x.id === id); const rec = Object.assign(body, {id});
    if (i >= 0) arr[i] = rec; else arr.push(rec); this.lsSet(col, arr);
  },
  async del(col, id){
    if (this.db){ await this.db.collection(col).doc(id).delete(); return; }
    this.lsSet(col, this.lsGet(col).filter(x => x.id !== id));
  }
};

/* ---------- durum ---------- */
let showCostPref = false; try { showCostPref = localStorage.getItem("altintas_showCost") === "1"; } catch(e){}
const S = { showCost:showCostPref, view:"list", teklifler:[], kutuphane:[], ayar:clone(DEFAULT_AYAR), curId:null, filter:"Tümü", q:"", libTarget:null, libQ:"", libGrup:"Tümü", libSel:[], saving:"", loaded:false, dl:undefined, sort:lsGet("sort", {k:"guncelleme", d:-1}), lastId:lsGet("last", null) };
const cur = () => S.teklifler.find(t => t.id === S.curId);

function mergeAyar(a){
  const d = clone(DEFAULT_AYAR); if (!a) return d;
  const fa = Object.assign({}, a.firma || {});
  if (fa.adres && !fa.showroomAdres) fa.showroomAdres = fa.adres;
  if (fa.telefon && !fa.showroomTel) fa.showroomTel = fa.telefon;
  return { firma:Object.assign(d.firma, fa), teklif:Object.assign(d.teklif, a.teklif || {}), sozlesmeMaddeleri:(a.sozlesmeMaddeleri && a.sozlesmeMaddeleri.length) ? a.sozlesmeMaddeleri : d.sozlesmeMaddeleri };
}

/* ---------- hesaplar ---------- */
const maddeTutar = m => num(m.miktar) * num(m.birimFiyat);
const bolumHesap = b => (b.maddeler || []).reduce((s, m) => s + maddeTutar(m), 0);
const bolumToplam = b => num(b.goturu) > 0 ? num(b.goturu) : bolumHesap(b);
const maddeMaliyet = m => num(m.miktar) * num(m.birimMaliyet);
const bolumMaliyet = b => num(b.goturuMaliyet) > 0 ? num(b.goturuMaliyet) : (b.maddeler || []).reduce((s, m) => s + maddeMaliyet(m), 0);
function calc(t){
  const kalem = (t.bolumler || []).reduce((s, b) => s + bolumToplam(b), 0);
  const ara = num(t.genelGoturu) > 0 ? num(t.genelGoturu) : kalem;
  const iskonto = num(t.iskonto);
  const matrah = Math.max(0, ara - iskonto);
  const kdv = matrah * num(t.kdvOran) / 100;
  const maliyet = (t.bolumler || []).reduce((s, b) => s + bolumMaliyet(b), 0);
  const kar = matrah - maliyet;
  return {kalem, ara, iskonto, matrah, kdv, dahil:matrah + kdv, odemeBaz: t.kdvGoster === "dahil" ? matrah + kdv : matrah, maliyet, kar, marj: matrah > 0 ? kar / matrah * 100 : 0};
}

/* ---------- akıllı madde ---------- */
const OPT_RE = /\[([^\[\]]*\|[^\[\]]*)\]/g;
const optGroups = txt => { const g = []; String(txt || "").replace(OPT_RE, (m, inner) => { g.push(inner.split("|").map(x => x.trim()).filter(Boolean)); return m; }); return g; };
function fillOpts(sablon, secimler){ let i = 0; return String(sablon || "").replace(OPT_RE, (m, inner) => { const opts = inner.split("|").map(x => x.trim()).filter(Boolean); const v = secimler && secimler[i] != null ? secimler[i] : opts[0]; i++; return v; }); }
function secimHTML(m, p){
  if (!m.sablon) return "";
  const g = optGroups(m.sablon); if (!g.length) return "";
  return '<div class="opts">'+g.map((opts, i) => '<select data-k="'+p+'secimler.'+i+'" aria-label="Seçenek '+(i+1)+'">'+opts.map(o => '<option'+((m.secimler||[])[i]===o?" selected":"")+'>'+esc(o)+'</option>').join("")+'</select>').join("")+'<span class="hint">Seçenekli madde: seçim değişince açıklama güncellenir.</span></div>';
}

/* ---------- teklif oluşturma ---------- */
function nextNo(prefix, list, key){
  const y = new Date().getFullYear(); const p = prefix + "-" + y + "-";
  let max = 0; list.forEach(x => { const v = key(x); if (v && v.startsWith(p)) max = Math.max(max, parseInt(v.slice(p.length), 10) || 0); });
  return p + String(max + 1).padStart(prefix === "ALT" ? 4 : 3, "0");
}
function newTeklif(){
  const a = S.ayar.teklif;
  return {
    id:uid(), no:nextNo("ALT", S.teklifler, x => x.no), rev:1, durum:"Taslak",
    olusturma:new Date().toISOString(), guncelleme:new Date().toISOString(),
    tarih:today(), gecerlilik:num(a.gecerlilik) || 15, hazirlayan:S.ayar.firma.yetkili || "",
    musteri:{ad:"", telefon:"", eposta:"", adres:"", kimlikNo:""}, proje:{ad:"", adres:""},
    giris:a.giris, gorunum:"genel", kdvOran:num(a.kdv), kdvGoster:"haric", genelGoturu:0, iskonto:0,
    bolumler:[], kosullar:String(a.kosullar || "").split("\n").map(s => s.trim()).filter(Boolean).map(t => ({t, on:true})),
    odemePlani:clone(DEFAULT_ODEME), sozlesme:null
  };
}
function latestRevs(){
  const by = {}; S.teklifler.forEach(t => { if (!by[t.no] || by[t.no].rev < t.rev) by[t.no] = t; });
  return Object.values(by).sort((a, b) => (b.guncelleme || "").localeCompare(a.guncelleme || ""));
}

/* ---------- kaydetme ---------- */
let saveTimer = null; const dirty = new Set();
function markDirty(t){ t.guncelleme = new Date().toISOString(); dirty.add(t.id); setSave("Kaydediliyor…"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
async function flush(){
  const ids = [...dirty]; dirty.clear();
  try { for (const id of ids){ const t = S.teklifler.find(x => x.id === id); if (t) await store.put("teklifler", t); } setSave("Kaydedildi"); }
  catch(e){ ids.forEach(i => dirty.add(i)); setSave("Kaydedilemedi, tekrar denenecek"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 4000); }
}
let ayarTimer = null;
function saveAyar(){ setSave("Kaydediliyor…"); clearTimeout(ayarTimer); ayarTimer = setTimeout(async () => { try { await store.put("ayarlar", Object.assign({id:"firma"}, S.ayar)); setSave("Kaydedildi"); } catch(e){ setSave("Kaydedilemedi"); } }, 700); }
const libTimers = {};
function saveLib(item){ setSave("Kaydediliyor…"); clearTimeout(libTimers[item.id]); libTimers[item.id] = setTimeout(async () => { try { await store.put("kutuphane", item); setSave("Kaydedildi"); } catch(e){ setSave("Kaydedilemedi"); } }, 700); }
function setSave(s){ S.saving = s; const el = document.getElementById("savestate"); if (el) el.textContent = s; }

let toastT = null;
function toast(msg, act){
  let el = document.querySelector(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.innerHTML = '<span>'+esc(msg)+'</span>' + (act ? '<button type="button" class="tact">'+esc(act.label)+'</button>' : "");
  if (act) el.querySelector(".tact").onclick = () => { el.hidden = true; act.fn(); };
  el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, act ? (act.ms || 7000) : 2800);
}

/* ---------- geri al ---------- */
const undoStack = [];
function snap(t, label){ undoStack.push({id:t.id, data:clone(t), label}); if (undoStack.length > 20) undoStack.shift(); }
function pushUndo(label, run){ undoStack.push({label, run}); if (undoStack.length > 20) undoStack.shift(); }
async function undo(){
  const u = undoStack.pop(); if (!u){ toast("Geri alınacak işlem yok"); return; }
  if (u.run) await u.run();
  else { const i = S.teklifler.findIndex(x => x.id === u.id); if (i >= 0) S.teklifler[i] = u.data; else S.teklifler.push(u.data); markDirty(u.data); }
  render(); toast("Geri alındı: " + u.label);
}
const undoAct = {label:"Geri al", fn:undo};
function setDurum(t, d){ t.durum = d; if (d === "Gönderildi" && !t.gonderim) t.gonderim = new Date().toISOString(); if (d === "Onaylandı" && !t.onayTarihi) t.onayTarihi = new Date().toISOString(); markDirty(t); }

/* ---------- yol ---------- */
function setPath(obj, path, val){ const k = path.split("."); let o = obj; for (let i = 0; i < k.length - 1; i++){ o = o[/^\d+$/.test(k[i]) ? +k[i] : k[i]]; if (o == null) return; } o[/^\d+$/.test(k[k.length-1]) ? +k[k.length-1] : k[k.length-1]] = val; }
function getPath(obj, path){ return path.split(".").reduce((o, k) => o == null ? o : o[/^\d+$/.test(k) ? +k : k], obj); }

/* ---------- görünümler ---------- */
function nav(){
  const n = latestRevs().length, sz = S.teklifler.filter(t => t.sozlesme && t.sozlesme.no).length;
  const b = (v, label, c) => '<button data-act="go" data-v="'+v+'" class="'+(S.view === v || (v === "list" && ["edit","preview"].includes(S.view)) || (v === "contracts" && S.view === "contract") ? "on" : "")+'"><span>'+label+'</span>'+(c != null ? '<span class="cnt">'+c+'</span>' : "")+'</button>';
  return '<aside class="side"><div class="brand">'+logoHTML(true)+'</div><nav aria-label="Ana menü">'+b("list","Teklifler",n)+b("contracts","Sözleşmeler",sz)+b("library","Madde kütüphanesi",S.kutuphane.length)+b("settings","Firma ve şablonlar")+'</nav><div class="foot">'+(store.mode === "db" ? "Veriler program klasöründe saklanıyor." : "Veriler bu tarayıcıda saklanıyor.")+'<br><span id="savestate">'+esc(S.saving)+'</span></div></aside>';
}

function render(){
  const app = document.getElementById("app");
  const views = {list:viewList, edit:viewEdit, preview:viewPreview, contract:viewContract, contracts:viewContracts, library:viewLibrary, settings:viewSettings};
  if (!cur() && ["edit","preview","contract"].includes(S.view)) S.view = "list";
  app.innerHTML = '<div class="shell">'+nav()+'<main class="main">'+(S.loaded ? views[S.view]() : '<p class="sub">Yükleniyor…</p>')+'</main></div>' + (S.libTarget != null ? libModal() : "");
  autoGrow(app);
}
function autoGrow(root){ root.querySelectorAll("textarea[data-grow]").forEach(t => { t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }); }

function pill(d){ return '<span class="pill st-'+esc(String(d).split(" ")[0])+'">'+esc(d)+'</span>'; }

function viewList(){
  const all = latestRevs();
  const acik = all.filter(t => ["Taslak","Gönderildi","Revizyon istendi"].includes(t.durum));
  const onay = all.filter(t => t.durum === "Onaylandı");
  let h = '<div class="top"><div class="grow"><h1>Teklifler</h1><div class="sub">Her satır bir teklifin son sürümünü gösterir.</div></div><button class="btn" data-act="csv">Excel\'e aktar</button><button class="btn pri" data-act="new">+ Yeni teklif</button></div>';
  h += '<div class="kpis"><div class="kpi"><small>Açık teklif</small><b>'+acik.length+'</b></div><div class="kpi"><small>Açık tekliflerin tutarı</small><b>'+money(acik.reduce((s,t)=>s+calc(t).matrah,0))+'</b></div><div class="kpi"><small>Onaylanan</small><b>'+onay.length+'</b></div><div class="kpi"><small>Onaylanan tutar</small><b>'+money(onay.reduce((s,t)=>s+calc(t).matrah,0))+'</b></div></div>';
  if (!all.length){
    return h + '<div class="empty"><img src="'+MARK_DOC+'" alt=""><b>Henüz teklif yok</b><span>İlk teklifinizi oluşturun: müşteri bilgilerini girin, bölümleri açın ve maddeleri kütüphaneden seçin.</span><button class="btn pri" data-act="new">+ Yeni teklif</button></div>';
  }
  h += '<div class="toolbar"><input type="text" id="q" data-act-input="q" placeholder="Müşteri, proje veya teklif no ara" value="'+esc(S.q)+'" aria-label="Ara"><div class="chips">'+["Tümü"].concat(DURUMLAR).map(d => '<button class="chip '+(S.filter===d?"on":"")+'" data-act="filter" data-v="'+esc(d)+'">'+esc(d)+'</button>').join("")+'</div></div>';
  const th = (k, label, cls) => '<th class="sortable'+(cls ? " "+cls : "")+'" data-act="sort" data-v="'+k+'" aria-sort="'+(S.sort.k === k ? (S.sort.d > 0 ? "ascending" : "descending") : "none")+'">'+label+(S.sort.k === k ? '<span class="sarr">'+(S.sort.d > 0 ? "▲" : "▼")+'</span>' : "")+'</th>';
  h += '<div class="tablewrap"><table class="list"><thead><tr>'+th("no","Teklif no")+th("musteri","Müşteri")+th("proje","Proje")+th("rev","Sürüm")+th("tutar","Tutar (KDV hariç)","r")+th("kar","Kâr","r")+th("durum","Durum")+th("guncelleme","Güncelleme")+'<th><span class="sr">İşlemler</span></th></tr></thead><tbody>';
  return h + listBody() + '</tbody></table></div>';
}
const SORT_VAL = {no:t => t.no, musteri:t => trLow(t.musteri.ad), proje:t => trLow(t.proje.ad), rev:t => t.rev, tutar:t => calc(t).matrah, kar:t => calc(t).maliyet ? calc(t).marj : -1e9, durum:t => DURUMLAR.indexOf(t.durum), guncelleme:t => t.guncelleme || ""};
function listBody(){
  const q = trLow(S.q);
  const f = SORT_VAL[S.sort.k] || SORT_VAL.guncelleme, d = S.sort.d;
  const rows = latestRevs().filter(t => (S.filter === "Tümü" || t.durum === S.filter) && (!q || trLow([t.no, t.musteri.ad, t.proje.ad, t.proje.adres].join(" ")).includes(q)))
    .sort((a, b) => { const x = f(a), y = f(b); return (typeof x === "string" ? x.localeCompare(y, "tr") : x - y) * d; });
  const lastNo = (S.teklifler.find(x => x.id === S.lastId) || {}).no;
  let h = rows.map(t => { const c = calc(t); return '<tr data-act="open" data-id="'+t.id+'" tabindex="0"'+(t.no === lastNo ? ' class="last"' : "")+'><td class="mono">'+esc(t.no)+(t.no === lastNo ? '<div class="lasttag">Son açılan</div>' : "")+'</td><td>'+(esc(t.musteri.ad) || '<span class="sub">Adsız müşteri</span>')+'</td><td>'+esc(t.proje.ad)+'<div class="sub">'+esc(t.proje.adres)+'</div></td><td>Rev.'+t.rev+'</td><td class="r mono">'+money(c.matrah)+'</td><td class="r">'+(c.maliyet ? '<span class="'+karCls(c.marj)+'" style="font-weight:700">%'+fmt.format(c.marj)+'</span>' : '<span class="sub">—</span>')+'</td>'
    + '<td class="rowact"><select class="dsel st-'+esc(String(t.durum).split(" ")[0])+'" data-rowdurum="'+t.id+'" aria-label="Durum: '+esc(t.no)+'">'+DURUMLAR.map(x => '<option'+(t.durum===x?" selected":"")+'>'+x+'</option>').join("")+'</select></td>'
    + '<td class="sub">'+trDate((t.guncelleme||"").slice(0,10))+'</td>'
    + '<td class="rowact nowrap"><button class="icon" data-act="rowprev" data-id="'+t.id+'" title="Önizle ve PDF" aria-label="Önizle ve PDF: '+esc(t.no)+'">⎙</button><button class="icon" data-act="rowcopy" data-id="'+t.id+'" title="Kopyala: aynı bölüm ve maddelerle yeni teklif" aria-label="Kopyala: '+esc(t.no)+'">⧉</button></td></tr>'; }).join("");
  if (!rows.length) h += '<tr><td colspan="9" class="sub" style="text-align:center;padding:24px">Aramaya uyan teklif yok.</td></tr>';
  return h;
}

function inp(path, val, o){ o = o || {}; return '<input type="'+(o.type||"text")+'" data-k="'+path+'"'+(o.n?' data-n="1" inputmode="decimal" class="num'+(o.cls?" "+o.cls:"")+'"':(o.cls?' class="'+o.cls+'"':""))+' value="'+esc(o.n ? numIn(val) : val)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':"")+(o.aria?' aria-label="'+esc(o.aria)+'"':"")+'>'; }
function fld(label, inner){ return '<label class="fld"><span>'+label+'</span>'+inner+'</label>'; }

  });

  // koşullar
  h += '<section class="card"><h2>Teklif koşulları <small>İşaretli olanlar belgede görünür</small></h2><div class="cond">'
    + t.kosullar.map((k, i) => '<label><input type="checkbox" data-k="kosullar.'+i+'.on" '+(k.on?"checked":"")+'><span class="t">'+esc(k.t)+'</span><button class="icon del" data-act="kdel" data-i="'+i+'" aria-label="Koşulu sil">✕</button></label>').join("")
    + '</div><div class="addsec"><div class="row"><input type="text" id="newkosul" placeholder="Yeni koşul yazın" aria-label="Yeni koşul"><button class="btn" data-act="kadd">Ekle</button></div></div></section>';

  h += '</div>' + asideHTML(t, c) + '</div>';
  return h;
}

  let h = '<aside class="aside"><section class="card"><h2>Müşteri fiyatı nasıl görsün?</h2><div class="seg" role="group" aria-label="Fiyat görünümü">'
    + [["genel","Genel toplam"],["bolum","Bölüm toplamları"],["madde","Madde fiyatları"]].map(([v,l]) => '<button data-act="gorunum" data-v="'+v+'" class="'+(g===v?"on":"")+'" aria-pressed="'+(g===v)+'">'+l+'</button>').join("")
    + '</div><div class="hint">'+({genel:"Belgede maddeler fiyatsız, en altta tek toplam görünür.", bolum:"Her bölümün sonunda bölüm toplamı, en altta genel toplam görünür.", madde:"Her maddenin miktarı, birim fiyatı ve tutarı görünür."})[g]+'</div></section>';

    + '<div class="tl"><span>Kalemlerden hesaplanan</span><span data-calc="kalem">'+money(c.kalem)+'</span></div>'
    + fld("Götürü toplam (isteğe bağlı)", inp("genelGoturu", t.genelGoturu, {n:1, ph:"Boşsa kalem toplamı kullanılır"}))
    + '<div data-calc="fark">'+(fark ? '<div class="warnbox">Götürü toplam kalem toplamından farklı. '+(g!=="genel"?"Belgede bölüm/madde tutarları ile toplam tutmayacak.":"Müşteri yalnızca götürü toplamı görür.")+'</div>' : "")+'</div>'
    + fld("İskonto (₺)", inp("iskonto", t.iskonto, {n:1}))
    + '<div class="grid" style="grid-template-columns:1fr 1fr">'+fld("KDV oranı", '<select data-k="kdvOran" data-n="1">'+[0,1,10,20].map(v => '<option value="'+v+'"'+(num(t.kdvOran)===v?" selected":"")+'>%'+v+'</option>').join("")+'</select>')
    + fld("Belgede KDV", '<select data-k="kdvGoster"><option value="haric"'+(t.kdvGoster!=="dahil"?" selected":"")+'>Hariç yaz</option><option value="dahil"'+(t.kdvGoster==="dahil"?" selected":"")+'>Dahil göster</option></select>')+'</div>'
    + '<div class="tl"><span>Toplam (KDV hariç)</span><span data-calc="matrah">'+money(c.matrah)+'</span></div>'
    + '<div class="tl"><span>KDV %'+num(t.kdvOran)+'</span><span data-calc="kdv">'+money(c.kdv)+'</span></div>'
    + '<div class="tl big"><span>'+(t.kdvGoster==="dahil"?"GENEL TOPLAM":"GENEL TOPLAM (KDV HARİÇ)")+'</span><span data-calc="genel">'+money(t.kdvGoster==="dahil"?c.dahil:c.matrah)+'</span></div>'
    + '<div class="yazi" data-calc="yazi">Yalnız '+esc(yaziyla(t.kdvGoster==="dahil"?c.dahil:c.matrah))+'</div></section>'
    + '<section class="card costcard"><h2>İç maliyet ve kâr <small>Müşteri görmez</small></h2>'
    + (S.showCost ? '<div class="tl"><span>Toplam maliyet</span><span data-calc="maliyet">'+money(c.maliyet)+'</span></div><div class="tl"><span>Kâr (KDV hariç)</span><span data-calc="kar">'+money(c.kar)+'</span></div><div class="tl"><span>Kâr oranı</span><span data-calc="marj" class="'+karCls(c.marj)+'">'+(c.maliyet ? "%"+fmt.format(c.marj) : "—")+'</span></div><div class="hint">Maliyeti madde bazında (birim maliyet) ya da bölüm bazında (götürü maliyet) girebilirsiniz.</div>' : '<div class="hint">Maliyet alanları gizli. Ekranı müşteriye gösterirken gizli tutun.</div>')

  return h;

function updateCalc(){
  const t = cur(); if (!t) return; const c = calc(t);
  document.querySelectorAll("[data-calc]").forEach(el => {
    const [k, a, b] = el.dataset.calc.split(":");
    if (k === "madde"){ const m = t.bolumler[a] && t.bolumler[a].maddeler[b]; if (m) el.textContent = money(maddeTutar(m)); }
    else if (k === "bolum"){ const bo = t.bolumler[a]; if (bo) el.textContent = money(bolumToplam(bo)); }
    else if (k === "odeme"){ const o = t.odemePlani[a]; if (o) el.textContent = money(c.odemeBaz * num(o.oran) / 100); }
    else if (k === "odemesum"){ const top = t.odemePlani.reduce((s,o)=>s+num(o.oran),0); const ok = Math.abs(top-100) < 0.001; el.className = ok ? "okbox" : "badbox"; el.textContent = ok ? "Toplam %100" : "Toplam %"+fmt.format(top)+", %100 olmalı"; }
    else if (k === "kalem") el.textContent = money(c.kalem);
    else if (k === "mkar"){ const m = t.bolumler[a] && t.bolumler[a].maddeler[b]; if (m) el.textContent = mkarText(m); }
    else if (k === "maliyet") el.textContent = money(c.maliyet);
    else if (k === "kar") el.textContent = money(c.kar);
    else if (k === "marj"){ el.textContent = c.maliyet ? "%"+fmt.format(c.marj) : "—"; el.className = karCls(c.marj); }
    else if (k === "matrah") el.textContent = money(c.matrah);
    else if (k === "kdv") el.textContent = money(c.kdv);
    else if (k === "genel") el.textContent = money(t.kdvGoster==="dahil"?c.dahil:c.matrah);
    else if (k === "yazi") el.textContent = "Yalnız " + yaziyla(t.kdvGoster==="dahil"?c.dahil:c.matrah);
    else if (k === "fark"){ const fark = num(t.genelGoturu) > 0 && Math.abs(num(t.genelGoturu) - c.kalem) > 0.5 && c.kalem > 0; el.innerHTML = fark ? '<div class="warnbox">Götürü toplam kalem toplamından farklı. '+(t.gorunum!=="genel"?"Belgede bölüm/madde tutarları ile toplam tutmayacak.":"Müşteri yalnızca götürü toplamı görür.")+'</div>' : ""; }
    else if (k === "sz-odsum") el.innerHTML = szOdemeCheck(t);
  });
}

function mkarText(m){ const t = maddeTutar(m), c = maddeMaliyet(m); if (!c) return "Maliyet girilmedi"; const k = t - c; return "Maliyet "+money(c)+" · kâr "+money(k)+(t > 0 ? " (%"+fmt.format(k / t * 100)+")" : ""); }
function karCls(marj){ return marj >= 20 ? "kar-ok" : marj >= 10 ? "kar-low" : "kar-bad"; }

const docMetin = s => S.ayar.teklif.buyukHarf ? String(s ?? "").toLocaleUpperCase("tr") : s;

function teklifKontrol(t){
  const e = [], c = calc(t), g = t.gorunum;
  if (!t.musteri.ad) e.push("Müşteri adı boş.");
  if (!t.musteri.telefon && !t.musteri.eposta) e.push("Müşterinin telefonu veya e-postası yok.");
  if (!t.proje.adres) e.push("Proje adresi boş.");
  if (!t.bolumler.length) e.push("Teklifte hiç bölüm yok.");
  t.bolumler.forEach((b, bi) => {
    if (!b.maddeler.length) e.push("“"+b.ad+"” bölümünde madde yok.");
    if (g !== "genel" && b.maddeler.length && bolumToplam(b) <= 0) e.push("“"+b.ad+"” bölümünün tutarı 0.");
    b.maddeler.forEach((m, mi) => {
      if (!String(m.baslik||"").trim() && !String(m.aciklama||"").trim()) e.push((bi+1)+"."+(mi+1)+" numaralı maddenin metni boş.");
      else if (g === "madde" && maddeTutar(m) <= 0 && !(num(b.goturu) > 0)) e.push((bi+1)+"."+(mi+1)+" numaralı maddenin fiyatı yok.");
    });
  });
  if (t.bolumler.length && c.matrah <= 0) e.push("Teklif tutarı 0.");
  if (g !== "genel" && num(t.genelGoturu) > 0 && Math.abs(num(t.genelGoturu) - c.kalem) > 0.5) e.push("Götürü toplam, belgede görünen bölüm/madde tutarlarıyla tutmuyor.");
  const son = addDays(t.tarih, num(t.gecerlilik));
  if (son < today()) e.push("Geçerlilik tarihi geçmiş ("+trDate(son)+"). Teklif tarihini güncelleyin.");
  return e;
}

/* ---------- sözleşme ---------- */
function ensureSz(t){

    t.sozlesme = {no:nextNo("SZ", S.teklifler, x => x.sozlesme && x.sozlesme.no), tarih:today(), baslama:"", teslim:"", kimlikNo:t.musteri.kimlikNo || "", isAdresi:t.proje.adres || t.musteri.adres || "",
      odemeler:t.odemePlani.map(o => ({tarih:"", yontem:"Havale / EFT", tutar:Math.round(c.odemeBaz*num(o.oran)/100*100)/100, aciklama:o.aciklama}))};
  }
  return t.sozlesme;
}
function szBedel(t){ const c = calc(t); return t.kdvGoster === "dahil" ? c.dahil : c.matrah; }
function szOdemeCheck(t){ const s = t.sozlesme; if (!s) return ""; const top = s.odemeler.reduce((a,o)=>a+num(o.tutar),0), b = szBedel(t); return Math.abs(top-b) < 0.01 ? '<span class="okbox">Ödemeler toplamı sözleşme bedeline eşit ('+money(b)+')</span>' : '<span class="badbox">Ödemeler toplamı '+money(top)+', sözleşme bedeli '+money(b)+'. Fark: '+money(b-top)+'</span>'; }
function szEksik(t){
  const s = t.sozlesme, f = S.ayar.firma, e = [];
  if (!t.musteri.ad) e.push("Müşteri adı"); if (!s.kimlikNo) e.push("Müşteri T.C. / vergi no"); if (!s.isAdresi) e.push("İş adresi");
  if (!s.baslama) e.push("İşe başlama tarihi"); if (!s.teslim) e.push("Teslim tarihi"); if (!f.yetkili) e.push("Firma yetkilisi (Firma ve şablonlar)"); if (!f.mahkeme) e.push("Yetkili mahkeme şehri (Firma ve şablonlar)");
  if (s.odemeler.some(o => !o.tarih)) e.push("Ödeme tarihleri");
  if (Math.abs(s.odemeler.reduce((a,o)=>a+num(o.tutar),0) - szBedel(t)) >= 0.01) e.push("Ödemeler toplamı bedele eşit değil");
  return e;
}

/* ---------- dosya kaydetme ---------- */
async function getDl(){ if (S.dl === undefined){ try { S.dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){ S.dl = null; } } return S.dl; }
async function saveFile(filename, data){
  const dl = await getDl(); if (!dl){ toast("Bu görünümde dosya indirme kullanılamıyor."); return; }
  try { await dl.save({filename, data}); toast("Dosya kaydedildi"); }
  catch(e){ const code = e && e.code; toast(code === "declined" ? "İndirme iptal edildi" : code === "rate_limited" ? "Bir indirme penceresi zaten açık" : "Dosya kaydedilemedi"); }
}
async function restoreFrom(file){
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.teklifler) || !Array.isArray(d.kutuphane)) { toast("Bu dosya bir Altıntaş yedeği değil"); return; }
    setSave("Geri yükleniyor…");
    for (const t of d.teklifler){ await store.put("teklifler", t); const i = S.teklifler.findIndex(x => x.id === t.id); if (i >= 0) S.teklifler[i] = t; else S.teklifler.push(t); }
    for (const k of d.kutuphane){ await store.put("kutuphane", k); const i = S.kutuphane.findIndex(x => x.id === k.id); if (i >= 0) S.kutuphane[i] = k; else S.kutuphane.push(k); }
    if (d.ayar){ S.ayar = mergeAyar(d.ayar); await store.put("ayarlar", Object.assign({id:"firma"}, S.ayar)); }
    setSave("Kaydedildi"); render(); toast(d.teklifler.length + " teklif ve " + d.kutuphane.length + " madde geri yüklendi");
  } catch(e){ toast("Yedek okunamadı"); }
}

/* ---------- PDF ---------- */
function svgToPng(src, size){
  return new Promise(res => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"); c.width = c.height = size; c.getContext("2d").drawImage(im, 0, 0, size, size); try { res(c.toDataURL("image/png")); } catch(e){ res(src); } }; im.onerror = () => res(src); im.src = src; });
}
function pdfSonrasi(t, kind){
  if (kind === "teklif" && ["Taslak","Revizyon istendi"].includes(t.durum))
    toast("PDF kaydedildi", {label:"Gönderildi olarak işaretle", ms:12000, fn:() => { setDurum(t, "Gönderildi"); render(); toast(t.no+" gönderildi olarak işaretlendi"); }});
  else toast("PDF kaydedildi");
}
async function makePdf(kind){
  const t = cur(); const el = document.getElementById("docEl"); if (!el || !t) return;
  if (!window.html2pdf){ toast("PDF aracı yüklenemedi. Sayfayı yenileyip tekrar deneyin."); return; }
  await getDl();
  if (!S.dl){ toast("Bu görünümde dosya indirme kullanılamıyor."); return; }
  const name = (kind === "sozlesme" ? t.sozlesme.no + " Sozlesme " : t.no + " Rev" + t.rev + " Teklif ") + (t.musteri.ad || "") ;
  const filename = name.trim().replace(/[\\/:*?"<>|]+/g, "") + ".pdf";
  toast("PDF hazırlanıyor…");
  if (window.altintasMasaustu){
    try {
      const clone = el.cloneNode(true); const inFoot = clone.querySelector(":scope > .d-foot"); if (inFoot) inFoot.remove();
      const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");
      const footCss = css.split("\n").filter(l => l.startsWith(".d-foot")).join("\n");
      const r = await window.altintasMasaustu.pdf({filename, css, footCss, body:clone.outerHTML, foot:firmaFoot(S.ayar.firma, "pdf"), belge:el.dataset.runhead || ""});
      if (r === "saved") pdfSonrasi(t, kind); else toast("İndirme iptal edildi");
    } catch(e){ toast("PDF oluşturulamadı"); }
    return;
  }
  const holders = [];
  const offscreen = (node) => { const h = document.createElement("div"); h.style.cssText = "position:fixed;left:-10000px;top:0;width:703px;background:#fff"; h.appendChild(node); document.body.appendChild(h); holders.push(h); return node; };
  const raster = async (root) => { for (const img of root.querySelectorAll("img")) { if (img.src.startsWith("data:image/svg")) img.src = await svgToPng(img.src, 240); } };
  const snap = async (node) => { const c = await window.html2pdf().set({html2canvas:{scale:2, backgroundColor:"#ffffff"}, jsPDF:{unit:"mm", format:"a4"}, margin:0}).from(node).toCanvas().get("canvas"); return {url:c.toDataURL("image/png"), ratio:c.height / c.width}; };
  try {
    const f = S.ayar.firma;
    const clone = offscreen(el.cloneNode(true)); clone.style.boxShadow = "none"; clone.style.margin = "0";
    clone.style.padding = "0"; clone.style.width = "703px"; clone.style.borderRadius = "0";
    const inFoot = clone.querySelector(":scope > .d-foot"); if (inFoot) inFoot.remove();
    await raster(clone);
    const footEl = document.createElement("div"); footEl.className = "doc"; footEl.style.cssText = "width:703px;padding:0;box-shadow:none;margin:0;border-radius:0"; footEl.innerHTML = firmaFoot(f, "pdf"); offscreen(footEl);
    const headEl = document.createElement("div"); headEl.className = "doc"; headEl.style.cssText = "width:703px;padding:0;box-shadow:none;margin:0;border-radius:0"; headEl.innerHTML = '<div class="d-runhead">'+logoHTML(false)+'<span>'+esc(el.dataset.runhead || "")+'</span></div>'; offscreen(headEl); await raster(headEl);
    const foot = await snap(footEl), head = await snap(headEl);
    const W = 186, fh = Math.min(30, W * foot.ratio), hh = W * head.ratio;
    const pdf = await window.html2pdf().set({margin:[10 + hh + 4, 12, 12 + fh + 6, 12], filename, image:{type:"jpeg", quality:0.95}, html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff"}, jsPDF:{unit:"mm", format:"a4", orientation:"portrait"}, pagebreak:{mode:["css","legacy"], avoid:[".d-madde",".d-sum",".d-sign",".d-sec-h",".d-cl",".d-cond","tr"]}}).from(clone).toPdf().get("pdf");
    const n = pdf.internal.getNumberOfPages();
    for (let i = 1; i <= n; i++){
      pdf.setPage(i);
      if (i > 1) pdf.addImage(head.url, "PNG", 12, 10, W, hh);
      pdf.addImage(foot.url, "PNG", 12, 297 - 12 - fh, W, fh);
      pdf.setFontSize(8); pdf.setTextColor(120, 132, 136); pdf.text(i + " / " + n, 198, 297 - 6, {align:"right"});
    }
    const blob = pdf.output("blob");
    holders.forEach(h => h.remove());
    await S.dl.save({filename, data:blob});
    pdfSonrasi(t, kind);
  } catch(e){
    holders.forEach(h => h.remove());
    const code = e && e.code;
    toast(code === "declined" ? "İndirme iptal edildi" : code === "rate_limited" ? "Bir indirme penceresi zaten açık" : "PDF oluşturulamadı");
  }
}

const isOrnek = x => x.ornek === true || /^ornek/.test(String(x.id));

    case "msave": { const m = t.bolumler[bi].maddeler[mi]; if (!m.baslik && !m.aciklama){ toast("Önce başlık veya açıklama yazın"); return; } const item = {id:uid(), grup:t.bolumler[bi].ad ? t.bolumler[bi].ad.charAt(0) + t.bolumler[bi].ad.slice(1).toLocaleLowerCase("tr") : "Diğer", baslik:m.baslik, aciklama:m.sablon || m.aciklama, birim:m.birim, birimFiyat:num(m.birimFiyat), birimMaliyet:num(m.birimMaliyet)}; S.kutuphane.push(item); try { await store.put("kutuphane", item); toast("Kütüphaneye kaydedildi"); } catch(err){ toast("Kaydedilemedi"); } render(); return; }

    case "libclose": S.libTarget = null; S.libSel = []; render(); return;
    case "libclose-bg": if (e.target === el){ S.libTarget = null; S.libSel = []; render(); } return;
    case "libgrup": S.libGrup = el.dataset.v; render(); { const q = document.getElementById(S.libTarget != null ? "libq" : "libq2"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } } return;

      snap(t, "Kütüphaneden ekleme"); picks.forEach(x => t.bolumler[S.libTarget].maddeler.push(libToMadde(x)));
      markDirty(t); S.libTarget = null; S.libSel = []; render(); toast(picks.length === 1 ? "Eklendi: " + (picks[0].baslik || "madde") : picks.length + " madde eklendi", undoAct); return; }
    case "libnew": { const item = {id:uid(), grup:S.libGrup !== "Tümü" ? S.libGrup : "", baslik:"", aciklama:"", birim:"gtr", birimFiyat:0}; S.kutuphane.unshift(item); S.libQ = ""; render(); saveLib(item); const f = document.querySelector('[data-k="lib.'+item.id+'.grup"]'); if (f) f.focus(); return; }
    case "libdel": { const id = el.dataset.id; const item = S.kutuphane.find(x => x.id === id); S.kutuphane = S.kutuphane.filter(x => x.id !== id); try { await store.del("kutuphane", id); } catch(err){}

    case "kadd": { const v = (document.getElementById("newkosul").value || "").trim(); if (!v) return; t.kosullar.push({t:v, on:true}); markDirty(t); render(); return; }
    case "kdel": e.preventDefault(); t.kosullar.splice(ii, 1); markDirty(t); render(); toast("Koşul silindi", undoAct); return;
    case "oadd": t.odemePlani.push({oran:0, aciklama:""}); markDirty(t); render(); return;

    case "szodel": t.sozlesme.odemeler.splice(ii, 1); markDirty(t); render(); return;
    case "szoreset": { const c = calc(t); t.sozlesme.odemeler = t.odemePlani.map(o => ({tarih:"", yontem:"Havale / EFT", tutar:Math.round(c.odemeBaz*num(o.oran)/100*100)/100, aciklama:o.aciklama})); markDirty(t); render(); return; }
    case "pdf": makePdf(el.dataset.kind); return;
    case "togglecost": S.showCost = !S.showCost; try { localStorage.setItem("altintas_showCost", S.showCost ? "1" : "0"); } catch(err){} render(); return;

    case "csv": {
      const rows = [["Teklif no","Sürüm","Durum","Tarih","Müşteri","Telefon","E-posta","Proje","Proje adresi","Tutar (KDV hariç)","KDV","Tutar (KDV dahil)","Maliyet","Kâr","Kâr %","Sözleşme no"]];
      latestRevs().forEach(x => { const c = calc(x); rows.push([x.no, x.rev, x.durum, trDate(x.tarih), x.musteri.ad, x.musteri.telefon, x.musteri.eposta, x.proje.ad, x.proje.adres, fmt.format(c.matrah), fmt.format(c.kdv), fmt.format(c.dahil), c.maliyet ? fmt.format(c.maliyet) : "", c.maliyet ? fmt.format(c.kar) : "", c.maliyet ? fmt.format(c.marj) : "", x.sozlesme && x.sozlesme.no || ""]); });
      const csv = "\ufeff" + rows.map(r => r.map(v => { v = String(v ?? ""); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";")).join("\r\n");

app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
  if (e.key === "Enter" && e.target.id === "newbolum"){ e.preventDefault(); document.querySelector('[data-act="badd"]').click(); }
  if (e.key === "Enter" && e.target.id === "newkosul"){ e.preventDefault(); document.querySelector('[data-act="kadd"]').click(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.libTarget != null){ S.libTarget = null; S.libSel = []; render(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "z"){
    if (e.target.matches && e.target.matches("input:not([type=checkbox]),textarea")) return;
    e.preventDefault(); undo(); return;
  }
  if (S.libTarget == null) return;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); const b = document.getElementById("libaddbtn"); if (b && !b.disabled) b.click(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    const items = [...document.querySelectorAll(".modal .libitem")]; if (!items.length) return;
    const i = items.indexOf(document.activeElement);
    const j = e.key === "ArrowDown" ? (i < 0 ? 0 : Math.min(items.length - 1, i + 1)) : (i <= 0 ? -1 : i - 1);
    e.preventDefault(); if (j < 0) document.getElementById("libq").focus(); else items[j].focus();
  }
});

function onField(e){
  const el = e.target;
  if (el.id === "q"){ S.q = el.value; const tb = document.querySelector("table.list tbody"); if (tb) tb.innerHTML = listBody(); return; }
  if (el.id === "libq"){ S.libQ = el.value; const ml = document.querySelector(".modal .ml"); if (ml) ml.innerHTML = libListHTML(); return; }
  if (el.id === "libq" || el.id === "libq2"){ S.libQ = el.value; const pos = el.selectionStart, id = el.id; render(); const q = document.getElementById(id); if (q){ q.focus(); q.setSelectionRange(pos, pos); } return; }
  if (el.dataset.grow != null){ el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }
  const val = el.type === "checkbox" ? el.checked : (el.dataset.n ? num(el.value) : el.value);
  if (el.dataset.s){ setPath(S.ayar, el.dataset.s, val); saveAyar(); const hp = document.querySelector(".hfprev"); if (hp) hp.innerHTML = hfPrev(); return; }
  const k = el.dataset.k; if (!k) return;
  if (k.startsWith("lib.")){ const [, id, key] = k.split("."); const item = S.kutuphane.find(x => x.id === id); if (item){ item[key] = val; saveLib(item); } return; }
  const t = cur(); if (!t) return;
  setPath(t, k, val);
  const sm = k.match(/^bolumler\.(\d+)\.maddeler\.(\d+)\.(secimler|aciklama)/);
  if (sm){ const m = t.bolumler[+sm[1]].maddeler[+sm[2]];
    if (sm[3] === "secimler"){ m.aciklama = fillOpts(m.sablon, m.secimler); markDirty(t); render(); return; }
    if (m.sablon){ delete m.sablon; delete m.secimler; markDirty(t); const o = el.closest(".mtext"); const op = o && o.querySelector(".opts"); if (op) op.remove(); updateCalc(); return; } }
  markDirty(t);
  if (k === "durum") setDurum(t, val);
  if (k === "durum" || k === "kdvGoster" || k === "kdvOran" || (S.view === "contract" && e.type === "change")) { render(); return; }
  updateCalc();
}
app.addEventListener("input", e => { if (e.target.matches("select,input[type=checkbox],input[type=date]")) return; onField(e); });
app.addEventListener("change", e => {
  if (e.target.dataset.rowdurum){ const x = S.teklifler.find(y => y.id === e.target.dataset.rowdurum); if (x){ setDurum(x, e.target.value); render(); toast(x.no+": "+x.durum); } return; }
  if (e.target.id === "restore"){ const fl = e.target.files && e.target.files[0]; if (fl) restoreFrom(fl); e.target.value = ""; return; } if (e.target.matches("select,input[type=checkbox],input[type=date]")) onField(e); else if (S.view === "contract" && e.target.dataset.k) render(); });

/* ---------- açılış ---------- */
(async function boot(){
  render();
  await store.init();
  try {
    const [t, k, a] = await Promise.all([store.list("teklifler"), store.list("kutuphane"), store.list("ayarlar")]);
    S.teklifler = t; S.kutuphane = k; S.ayar = mergeAyar(a.find(x => x.id === "firma"));
    S.teklifler.forEach(x => { x.bolumler = x.bolumler || []; x.kosullar = x.kosullar || []; x.odemePlani = x.odemePlani || []; x.musteri = x.musteri || {}; x.proje = x.proje || {}; });
  } catch(e){ toast("Veriler yüklenemedi. Sayfayı yenileyin."); }
  S.loaded = true; render();
})();
})();
